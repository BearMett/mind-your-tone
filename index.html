<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Codex와 Claude Code가 잰 프롬프트 톤 온도 랭킹. 뜨거운 순과 온화한 순, 둘 다 있습니다." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mind Your Tone" />
    <meta property="og:description" content="당신의 프롬프트는 몇 도였을까요? Codex와 Claude Code가 잰 톤 온도 랭킹." />
    <meta property="og:url" content="https://mind-your-tone.vercel.app/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mind Your Tone" />
    <meta name="twitter:description" content="당신의 프롬프트는 몇 도였을까요? Codex와 Claude Code가 잰 톤 온도 랭킹." />
    <title>Mind Your Tone</title>
    <style>
      :root { color-scheme: light; font-family: Pretendard, system-ui, sans-serif; background: #eaf4fb; color: #18202b; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #fff 0, #eaf4fb 42rem); }
      main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
      header { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 24px; }
      h1 { margin: 0 0 10px; font-size: clamp(2rem, 7vw, 4.5rem); letter-spacing: -.07em; }
      header p { margin: 0; color: #597087; font-size: 1.05rem; }
      .lang { flex: none; color: #597087; font-size: .85rem; }
      .lang a { color: #087dbd; text-decoration: none; }
      .lang a[aria-current="page"] { color: #18202b; font-weight: 700; }
      .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
      .tabs a { padding: 9px 16px; color: #327399; text-decoration: none; background: #fff; border: 1px solid #c8dbe8; border-radius: 999px; font-weight: 700; }
      .tabs a[aria-current="page"] { color: #fff; background: #087dbd; border-color: #087dbd; }
      #ranking { display: grid; gap: 12px; }
      article { display: grid; grid-template-columns: 72px 1fr auto; align-items: center; min-height: 126px; overflow: hidden; background: #fff; border: 1px solid #d7e4ed; border-radius: 18px; box-shadow: 0 10px 30px rgb(19 71 111 / 7%); }
      article.highlight { border-color: #f2a71b; box-shadow: 0 0 0 4px rgb(242 167 27 / 25%), 0 10px 30px rgb(19 71 111 / 7%); }
      .rank { align-self: stretch; display: grid; place-items: center; background: #087dbd; color: #fff; font-size: 1.5rem; font-weight: 900; }
      .w0 { --heat: #2a9d6f; } .w1 { --heat: #4fa3c7; } .w2 { --heat: #d99a2b; } .w3 { --heat: #e0612f; } .w4 { --heat: #b3261e; }
      article .rank { background: var(--heat, #087dbd); }
      article .title, article .score { color: var(--heat, #0782c5); }
      .entry { min-width: 0; padding: 18px 22px; }
      .prompt { display: -webkit-box; overflow: hidden; margin-bottom: 10px; color: #18202b; font-size: 1.05rem; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
      .source { display: inline-block; margin-right: 8px; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; vertical-align: 2px; text-transform: uppercase; }
      .source.claude { background: #fbe7de; color: #b4532e; }
      .source.codex { background: #e6e8ec; color: #1f2933; }
      .source.lang-tag { background: transparent; border: 1px solid #c8dbe8; color: #597087; }
      .who { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; color: #597087; font-size: .95rem; }
      .title { font-weight: 800; }
      .score { display: grid; justify-items: end; padding: 20px 26px; color: #0782c5; font-size: clamp(2rem, 7vw, 3.6rem); font-weight: 900; font-style: italic; letter-spacing: -.06em; line-height: 1; }
      .band { font-size: .85rem; font-style: normal; letter-spacing: 0; }
      .empty { padding: 64px 24px; text-align: center; color: #718498; background: #fff9; border: 1px dashed #bfd0dc; border-radius: 18px; }
      nav { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 24px; }
      nav a { padding: 9px 14px; color: #087dbd; text-decoration: none; background: #fff; border: 1px solid #c8dbe8; border-radius: 10px; }
      nav a[aria-disabled="true"] { color: #a2afb8; pointer-events: none; }
      footer { margin-top: 40px; color: #718498; font-size: .9rem; text-align: center; }
      footer a { color: #087dbd; }
      footer pre { overflow-x: auto; margin: 0 0 12px; padding: 12px 16px; background: #fff; border: 1px solid #d7e4ed; border-radius: 12px; font-size: .8rem; line-height: 1.5; text-align: left; color: #3d5062; }
      footer p { margin: 0; }
      @media (max-width: 560px) {
        main { padding: 36px 0; }
        header { display: block; }
        article { grid-template-columns: 52px 1fr auto; min-height: 88px; border-radius: 14px; }
        .rank { font-size: 1.1rem; }
        .entry { padding: 14px; }
        .score { padding: 14px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Mind Your Tone</h1>
          <p id="tagline"></p>
        </div>
        <div class="lang" id="lang"></div>
      </header>
      <div class="tabs" role="tablist" id="tabs"></div>
      <section id="ranking" aria-live="polite"><div class="empty" id="loading"></div></section>
      <nav id="pagination" aria-label="ranking pages"></nav>
      <footer>
        <pre># Claude Code
claude plugin marketplace add BearMett/mind-your-tone
claude plugin install mind-your-tone@mind-your-tone

# Codex
codex plugin marketplace add BearMett/mind-your-tone
codex plugin add mind-your-tone@mind-your-tone</pre>
        <p><span id="footer-label"></span> <a href="https://github.com/BearMett/mind-your-tone">BearMett/mind-your-tone</a></p>
      </footer>
    </main>
    <script type="module">
      const STRINGS = {
        ko: {
          tagline: '우리가 함께 일하는 방법', loading: '랭킹 불러오는 중…', failed: '랭킹을 불러오지 못했습니다.',
          rude: '🔥 뜨거운 순', polite: '🍃 온화한 순', emptyRude: '아직 등록된 폭염이 없습니다.', emptyPolite: '아직 등록된 산들바람이 없습니다.',
          previous: '이전', next: '다음', footer: '사용법과 코드:',
          weather: ['🍃 산들바람', '🌤 쾌적', '🌡 후끈', '🔥 폭염', '🌋 분화'],
        },
        en: {
          tagline: 'How we work together', loading: 'Loading rankings…', failed: 'Could not load the rankings.',
          rude: '🔥 Hottest', polite: '🍃 Mildest', emptyRude: 'No heatwaves yet.', emptyPolite: 'No breezes yet.',
          previous: 'Previous', next: 'Next', footer: 'Usage and code:',
          weather: ['🍃 Breeze', '🌤 Fair', '🌡 Warm', '🔥 Heatwave', '🌋 Eruption'],
        },
      };
      // ponytail: script-based guess; add a stored language field if other scripts show up
      const promptLanguage = (text) => (/[\u3131-\uD79D]/.test(text) ? 'ko' : /[A-Za-z]/.test(text) ? 'en' : '');
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') === 'en' || (!params.has('lang') && !navigator.language.startsWith('ko')) ? 'en' : 'ko';
      const t = STRINGS[lang];
      document.documentElement.lang = lang;
      const polite = params.get('order') === 'polite';
      const order = polite ? 'polite' : 'rude';
      const highlight = params.get('highlight') || '';
      const page = Math.max(1, Number.parseInt(params.get('page') || '1', 10) || 1);
      const link = (extra) => `?${new URLSearchParams({ order, lang, ...extra })}`;
      const ranking = document.querySelector('#ranking');
      const pagination = document.querySelector('#pagination');

      document.querySelector('#tagline').textContent = t.tagline;
      document.querySelector('#loading').textContent = t.loading;
      document.querySelector('#footer-label').textContent = t.footer;
      document.querySelector('#lang').replaceChildren(...[['ko', '한국어'], ['en', 'English']].flatMap(([key, label], i) => {
        const a = document.createElement('a');
        a.href = `?${new URLSearchParams({ order, lang: key, page })}`;
        a.textContent = label;
        if (key === lang) a.setAttribute('aria-current', 'page');
        return i ? [' · ', a] : [a];
      }));
      document.querySelector('#tabs').replaceChildren(...['rude', 'polite'].map((key) => {
        const a = document.createElement('a');
        a.href = `?${new URLSearchParams({ order: key, lang })}`;
        a.textContent = t[key];
        if (key === order) a.setAttribute('aria-current', 'page');
        return a;
      }));

      try {
        const query = new URLSearchParams({ order, page });
        if (highlight) query.set('highlight', highlight);
        const response = await fetch(`/api/rankings?${query}`);
        if (!response.ok) throw new Error();
        const data = await response.json();
        const entries = data.entries;

        if (!entries.length) {
          ranking.innerHTML = `<div class="empty">${polite ? t.emptyPolite : t.emptyRude}</div>`;
        } else {
          ranking.replaceChildren(...entries.map((entry, index) => {
            const article = document.createElement('article');
            const rank = document.createElement('div');
            const detail = document.createElement('div');
            const prompt = document.createElement('div');
            const source = document.createElement('span');
            const promptLang = document.createElement('span');
            const who = document.createElement('div');
            const title = document.createElement('span');
            const name = document.createElement('span');
            const score = document.createElement('div');
            const band = document.createElement('span');

            const heat = Math.min(4, Math.floor(entry.score / 20));
            article.id = `entry-${entry.id}`;
            article.classList.add(`w${heat}`);
            if (entry.id === highlight) article.classList.add('highlight');
            rank.className = 'rank';
            rank.textContent = (data.page - 1) * 20 + index + 1;
            detail.className = 'entry';
            source.className = `source ${entry.source}`;
            source.textContent = entry.source;
            prompt.className = 'prompt';
            const detected = promptLanguage(entry.promptPreview);
            promptLang.className = 'source lang-tag';
            promptLang.textContent = detected;
            if (detected) prompt.lang = detected;
            prompt.append(source, detected ? promptLang : '', `“${entry.promptPreview}”`);
            who.className = 'who';
            title.className = 'title';
            title.textContent = data.titles[entry.titleKey]?.[lang] ?? entry.titleKey;
            name.textContent = entry.displayName;
            who.append(title, '·', name);
            score.className = 'score';
            band.className = 'band';
            band.textContent = t.weather[heat];
            score.append(`${entry.score}°`, band);
            detail.append(prompt, who);
            article.append(rank, detail, score);
            return article;
          }));
          document.querySelector('.highlight')?.scrollIntoView({ block: 'center' });
        }

        if (data.pages > 1) {
          const previous = document.createElement('a');
          const status = document.createElement('span');
          const next = document.createElement('a');
          previous.textContent = t.previous;
          previous.href = link({ page: data.page - 1 });
          previous.setAttribute('aria-disabled', data.page === 1);
          status.textContent = `${data.page} / ${data.pages}`;
          next.textContent = t.next;
          next.href = link({ page: data.page + 1 });
          next.setAttribute('aria-disabled', data.page === data.pages);
          pagination.replaceChildren(previous, status, next);
        }
      } catch {
        ranking.innerHTML = `<div class="empty">${t.failed}</div>`;
      }
    </script>
  </body>
</html>
